name: CI

on:
  pull_request:
  push:
    branches: [main]

# Untrusted pull-request code never runs with production secrets. This workflow
# uses no repository secrets at all; every integration runs disabled or fixture.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
  # Cloudflare's published always-pass test sitekey. The committed
  # apps/web/.env.production carries the real production sitekey, which Next
  # would otherwise bake into the CI build; a real widget cannot issue a token
  # for 127.0.0.1, so every form would stall at client validation. The test key
  # issues a dummy token that the fixture-mode server accepts.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  GHL_MODE: disabled
  AI_MODE: disabled
  MLS_PROVIDER: fixture
  TURNSTILE_MODE: fixture

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Content lint
        run: pnpm content:lint

      - name: Production build
        run: pnpm build

  database:
    name: Migrations and row level security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Apply migrations and run the RLS suite
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/db-verify.sh

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @tract/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run smoke tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Refuse a tracked .env file
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git and must be removed"
            exit 1
          fi

      - name: Scan for credential-shaped strings in tracked files
        run: ./scripts/secret-scan.sh
