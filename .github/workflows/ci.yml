name: CI

on:
  pull_request:
  push:
    branches: [main]

# Untrusted pull-request code never runs with production secrets. This workflow
# uses no repository secrets at all; every integration runs disabled or fixture.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
  GHL_MODE: disabled
  AI_MODE: disabled
  MLS_PROVIDER: fixture
  TURNSTILE_MODE: fixture

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Content lint
        run: pnpm content:lint

      - name: Production build
        run: pnpm build

  database:
    name: Migrations and row level security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations and run the RLS suite
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/db-verify.sh

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @tract/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run smoke tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Refuse a tracked .env file
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git and must be removed"
            exit 1
          fi

      - name: Scan for credential-shaped strings in tracked files
        run: |
          # Matches the shapes real keys take. .env.example is excluded because
          # it contains names and empty values by design.
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
             -- ':!.env.example' ':!*.md' ':!pnpm-lock.yaml'; then
            echo "::error::a credential-shaped string is present in a tracked file"
            exit 1
          fi
